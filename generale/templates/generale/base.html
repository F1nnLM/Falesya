{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falesya</title>
    <link rel="stylesheet" href="{% static 'generale/css/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Falesya</a>
        <form action="{% url 'risultati' %}" method="GET">
            <input type="text" name="q" placeholder="Cerca falesia o percorso...">
            <button type="submit">Cerca</button>
        </form>
        <a href="#">Mappa</a>
        {% if user.is_authenticated %}
            <a href="{% url 'profilo' %}">Profilo</a>
            <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn-logout">Esci</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>

    {% if messages %}
    <div class="messaggi-flash">
        {% for msg in messages %}
            <div class="messaggio messaggio-{{ msg.tags }}">{{ msg }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <main>
        {% block contenuto %}{% endblock %}
    </main>

    <footer>
        <p>Falesya by Ludovico Marino</p>
    </footer>
</body>
</html>
