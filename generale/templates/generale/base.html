{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falesya</title>
    <link rel="stylesheet" href="{% static 'generale/css/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Falesya</a>
        <form action="{% url 'risultati' %}" method="GET">
            <input type="text" name="q" placeholder="Cerca falesia o percorso...">
            <button type="submit">Cerca</button>
        </form>
        <a href="#">Mappa</a>
        {% if user.is_authenticated %}
            <a href="#">Profilo</a>
        {% else %}
            <a href="#">Login</a>
        {% endif %}
    </nav>

    <main>
        {% block contenuto %}{% endblock %}
    </main>

    <footer>
        <p>Falesya by Ludovico Marino</p>
    </footer>
</body>
</html>
